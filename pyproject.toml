[tool.poetry]
name = "lamatrix"
version = "1.0.3"
description = ""
authors = ["Christina Hedges <christina.l.hedges@nasa.gov>"]
readme = "README.rst"
packages = [{include = "lamatrix", from = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
numpy = ">=1.24"
rich = ">13.7.1"
scipy = ">=1.3"

# Optional dependencies
sparse3d = { version = ">1.0.0", optional = true }
astropy = { version = ">=5.0.0", optional = true}
lkspacecraft = {version = ">=1.0.5", optional = true}
gaiaoffline = { version = "^1.0.3", optional = true }

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
black = "^24.2.0"
isort = "^5.13.2"
mypy = "^1.9.0"
pytest = "^8.1.1"
jupyterlab = "^4.1.4"
matplotlib = "^3.8.3"
nbsphinx = "^0.9.3"
sphinx = "^7.3.7"
sphinx_rtd_theme = "^2.0.0"
sphinx_astropy = "^1.9.1"
sphinx_automodapi = "^0.17.0"
pydata-sphinx-theme = "^0.15.4"
sphinx-autobuild = "^2024.10.3"
flake8 = "^7.1.1"
jupyter-contrib-nbextensions = "^0.7.0"
nbconvert = "^7.16.6"
notebook = "6.5.6"
pytest-cov = "^6.1.1"

[tool.poetry.extras]
ffi = ["sparse3d", "astropy", "gaiaoffline", "lkspacecraft"]  # Install with pip install tool[viz]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
